<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lago - Acceder</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Campus Lago</h1>
                <p>Red social del IES El Lago</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" id="tabLogin" onclick="showTab('login')">Iniciar sesión</button>
                <button type="button" class="tab-btn" id="tabRegister" onclick="showTab('register')">Crear cuenta</button>
            </div>

            <!-- Formulario de Login -->
            <form id="formLogin" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <p id="loginError" class="auth-error"></p>
                <button type="submit" class="btn-primary btn-full">Entrar</button>
            </form>

            <!-- Formulario de Registro -->
            <form id="formRegister" class="auth-form hidden">
                <div class="form-group">
                    <label for="regName">Nombre completo</label>
                    <input type="text" id="regName" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
                </div>
                <p id="registerError" class="auth-error"></p>
                <button type="submit" class="btn-primary btn-full">Crear cuenta</button>
            </form>
        </div>
    </div>

    <script src="../config.js"></script>
    <script>
        // Si ya hay sesión, ir directamente al inicio
        if (localStorage.getItem('token')) {
            window.location.href = 'home.html';
        }

        function showTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('formLogin').classList.toggle('hidden', !isLogin);
            document.getElementById('formRegister').classList.toggle('hidden', isLogin);
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabRegister').classList.toggle('active', !isLogin);
        }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.error;
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'home.html';
            } catch (err) {
                errorEl.textContent = 'No se puede conectar con el servidor.';
            }
        });

        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('registerError');
            errorEl.textContent = '';

            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            if (password.length < 6) {
                errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.error;
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'home.html';
            } catch (err) {
                errorEl.textContent = 'No se puede conectar con el servidor.';
            }
        });
    </script>
</body>
</html>
