<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Campus Lago - Red social de IES El Lago</title>
  <meta name="description" content="Campus Lago es la red social educativa de IES El Lago. Conecta con compañeros y profesores, consulta noticias del centro y gestiona tu vida académica.">
  <meta name="author" content="IES El Lago">
  <meta name="keywords" content="IES El Lago, Campus Lago, red social educativa, intranet escolar, Madrid">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Campus Lago - Red social de IES El Lago">
  <meta property="og:description" content="Conecta con compañeros y profesores de IES El Lago. Noticias, mensajes y mucho más.">
  <meta property="og:locale" content="es_ES">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Campus Lago">
  <meta name="twitter:description" content="Red social educativa de IES El Lago.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-logo">
      <h1>Campus Lago</h1>
      <p>Red social de IES El Lago</p>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" data-tab="login">Iniciar sesión</button>
      <button class="tab-btn" data-tab="register">Registrarse</button>
    </div>

    <!-- Login -->
    <div class="auth-panel active" id="panel-login">
      <form id="form-login">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="usuario@educa.madrid.org" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="Contraseña" required autocomplete="current-password">
        </div>
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" class="btn-primary" id="btn-login">Entrar</button>
        <button type="button" class="btn-link" id="btn-forgot">¿Olvidaste la contraseña?</button>
      </form>
    </div>

    <!-- Register -->
    <div class="auth-panel" id="panel-register">
      <form id="form-register">
        <div class="form-group">
          <label for="reg-name">Nombre completo</label>
          <input type="text" id="reg-name" placeholder="Nombre Apellido" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="reg-username">Nombre de usuario</label>
          <input type="text" id="reg-username" placeholder="sin espacios" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="reg-email">Email institucional</label>
          <input type="email" id="reg-email" placeholder="usuario@educa.madrid.org" required autocomplete="email">
          <small class="form-hint">Solo se aceptan cuentas @educa.madrid.org</small>
        </div>
        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
        </div>
        <div id="reg-error" class="form-error hidden"></div>
        <div id="reg-success" class="form-success hidden"></div>
        <button type="submit" class="btn-primary" id="btn-register">Solicitar registro</button>
        <p class="form-note">El administrador revisará tu solicitud. <a href="http://ies-el-lago.es" target="_blank" rel="noopener noreferrer">Más info</a></p>
      </form>
    </div>

    <!-- Forgot password -->
    <div class="auth-panel" id="panel-forgot">
      <form id="form-forgot">
        <p class="form-note">Introduce tu email para recibir un PIN de recuperación.</p>
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" placeholder="usuario@educa.madrid.org" required autocomplete="email">
        </div>
        <div id="forgot-error" class="form-error hidden"></div>
        <div id="forgot-success" class="form-success hidden"></div>
        <button type="submit" class="btn-primary">Enviar PIN</button>
        <button type="button" class="btn-link" id="btn-back-login">Volver al inicio de sesión</button>
      </form>

      <form id="form-reset" class="hidden">
        <div class="form-group">
          <label for="reset-pin">PIN de 6 dígitos</label>
          <input type="text" id="reset-pin" placeholder="000000" maxlength="6" required autocomplete="one-time-code">
        </div>
        <div class="form-group">
          <label for="reset-password">Nueva contraseña</label>
          <input type="password" id="reset-password" placeholder="Mínimo 8 caracteres" minlength="8" required autocomplete="new-password">
        </div>
        <div id="reset-error" class="form-error hidden"></div>
        <div id="reset-success" class="form-success hidden"></div>
        <button type="submit" class="btn-primary">Cambiar contraseña</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
