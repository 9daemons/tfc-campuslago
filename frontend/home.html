<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Campus Lago</title>
  <meta name="description" content="Tu muro de Campus Lago. Consulta publicaciones, noticias del centro y conecta con la comunidad de IES El Lago.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="app-body">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="home.html" class="nav-brand">Campus Lago</a>
    </div>
    <div class="nav-center">
      <input type="search" id="nav-search" placeholder="Buscar..." class="nav-search-input" aria-label="Buscar usuarios o publicaciones">
    </div>
    <div class="nav-right">
      <a href="messages.html" class="nav-icon" title="Mensajes" aria-label="Mensajes">✉</a>
      <button type="button" class="nav-icon" id="btn-notif" title="Notificaciones" aria-label="Notificaciones">🔔<span class="notif-badge hidden" id="notif-count">0</span></button>
      <button type="button" class="nav-icon" id="btn-theme" title="Modo oscuro" aria-label="Cambiar tema">🌙</button>
      <a href="profile.html" id="nav-avatar-link" class="nav-avatar" aria-label="Mi perfil">
        <img src="assets/default-avatar.svg" id="nav-avatar-img" alt="Mi avatar">
      </a>
    </div>
  </nav>

  <!-- Notificaciones dropdown -->
  <div class="notif-dropdown hidden" id="notif-dropdown" role="region" aria-label="Notificaciones">
    <div class="notif-header">
      <span>Notificaciones</span>
      <button type="button" id="btn-mark-read">Marcar como leídas</button>
    </div>
    <div id="notif-list"></div>
  </div>

  <!-- Search results overlay -->
  <div class="search-results hidden" id="search-results" role="region" aria-label="Resultados de búsqueda"></div>

  <!-- Main layout -->
  <main class="app-main">

    <aside class="sidebar-left" aria-label="Mensajes recientes">
      <div class="sidebar-section">
        <h2>Mensajes recientes</h2>
        <div id="recent-messages"></div>
        <a href="messages.html" class="sidebar-link">Ver todos</a>
      </div>
    </aside>

    <section class="feed-unified" aria-label="Publicaciones">
      <div class="feed-header">
        <h1>Inicio</h1>
        <button type="button" class="btn-primary btn-sm" id="btn-new-post">+ Publicar</button>
      </div>
      <div id="feed-unified">
        <div class="loading">Cargando...</div>
      </div>
    </section>

    <aside class="sidebar-right" aria-label="Sugerencias">
      <div class="sidebar-section">
        <h2>Personas que quizás conozcas</h2>
        <div id="suggested-users"><div class="loading">Cargando...</div></div>
      </div>
    </aside>

  </main>

  <!-- Mobile bottom nav -->
  <nav class="mobile-nav" aria-label="Navegación principal">
    <a href="home.html" class="mobile-nav-item active" aria-label="Inicio" aria-current="page">🏠</a>
    <a href="search.html" class="mobile-nav-item" aria-label="Buscar">🔍</a>
    <a href="messages.html" class="mobile-nav-item" aria-label="Mensajes">✉</a>
    <a href="profile.html" class="mobile-nav-item" aria-label="Perfil">👤</a>
  </nav>

  <!-- Modal nuevo post -->
  <div class="modal-overlay hidden" id="modal-post" role="dialog" aria-modal="true" aria-labelledby="modal-post-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-post-title">Nuevo post</h3>
        <button type="button" class="modal-close" id="btn-close-post" aria-label="Cerrar">✕</button>
      </div>
      <form id="form-post">
        <div class="form-group">
          <label for="post-content">¿Qué quieres compartir?</label>
          <textarea id="post-content" placeholder="Escribe aquí..." rows="4" maxlength="1000"></textarea>
        </div>
        <div class="form-group">
          <label class="file-label" for="post-image">
            📷 Añadir imagen
            <input type="file" id="post-image" accept="image/*" class="hidden">
          </label>
          <img id="post-image-preview" class="hidden" alt="Vista previa de la imagen seleccionada">
        </div>
        <div class="form-group hidden" id="anon-toggle-container">
          <label class="toggle-label">
            <input type="checkbox" id="post-anonymous">
            Publicar como anónimo / escuela
          </label>
        </div>
        <div id="post-error" class="form-error hidden" role="alert"></div>
        <button type="submit" class="btn-primary">Publicar</button>
      </form>
    </div>
  </div>

  <!-- Modal comentarios -->
  <div class="modal-overlay hidden" id="modal-comments" role="dialog" aria-modal="true" aria-label="Comentarios">
    <div class="modal">
      <div class="modal-header">
        <h3>Comentarios</h3>
        <button type="button" class="modal-close" id="btn-close-comments" aria-label="Cerrar">✕</button>
      </div>
      <div id="comments-list"></div>
      <form id="form-comment">
        <label for="comment-input" class="sr-only">Escribe un comentario</label>
        <input type="text" id="comment-input" placeholder="Escribe un comentario..." required>
        <button type="submit" class="btn-primary btn-sm">Enviar</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
