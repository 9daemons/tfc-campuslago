<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mensajes - Campus Lago</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="app-body">

  <nav class="navbar">
    <div class="nav-left">
      <a href="home.html" class="nav-brand">Campus Lago</a>
    </div>
    <div class="nav-right">
      <button type="button" class="nav-icon" id="btn-theme" title="Modo oscuro">🌙</button>
      <a href="profile.html" id="nav-avatar-link" class="nav-avatar">
        <img src="assets/default-avatar.svg" id="nav-avatar-img" alt="Perfil">
      </a>
    </div>
  </nav>

  <main class="messages-main">
    <div class="conversations-panel">
      <div class="conversations-header">
        <h2>Mensajes</h2>
        <button class="btn-primary btn-sm" id="btn-new-conv">+ Nuevo</button>
      </div>
      <div id="conversations-list">
        <div class="loading">Cargando...</div>
      </div>
    </div>

    <div class="chat-panel" id="chat-panel">
      <div class="chat-empty">
        <p>Selecciona una conversación</p>
      </div>
    </div>
  </main>

  <!-- Modal nueva conversación -->
  <div class="modal-overlay hidden" id="modal-new-conv">
    <div class="modal">
      <div class="modal-header">
        <h3>Nueva conversación</h3>
        <button class="modal-close" id="btn-close-conv">✕</button>
      </div>
      <div class="form-group">
        <label>Buscar usuario</label>
        <input type="text" id="conv-search" placeholder="Nombre de usuario...">
        <div id="conv-search-results"></div>
      </div>
      <div class="form-group">
        <label class="toggle-label">
          <input type="checkbox" id="conv-is-group">
          Crear grupo
        </label>
      </div>
      <div class="form-group hidden" id="group-name-group">
        <label>Nombre del grupo</label>
        <input type="text" id="conv-group-name" placeholder="Nombre del grupo">
      </div>
      <div id="selected-users" class="selected-users"></div>
      <button class="btn-primary" id="btn-create-conv">Crear</button>
    </div>
  </div>

  <nav class="mobile-nav">
    <a href="home.html" class="mobile-nav-item">🏠</a>
    <a href="search.html" class="mobile-nav-item">🔍</a>
    <a href="messages.html" class="mobile-nav-item active">✉</a>
    <a href="profile.html" class="mobile-nav-item">👤</a>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
