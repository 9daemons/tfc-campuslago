<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes - Campus Lago</title>
  <meta name="description" content="Mensajes directos y conversaciones en Campus Lago, la red social educativa de IES El Lago.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="app-body">

  <a href="#main-content" class="skip-nav">Saltar al contenido</a>

  <nav class="navbar" aria-label="Navegación principal">
    <div class="nav-left">
      <a href="home.html" class="nav-brand">Campus Lago</a>
    </div>
    <div class="nav-center">
      <input type="search" id="nav-search-redirect" placeholder="Buscar..." class="nav-search-input" aria-label="Buscar usuarios o publicaciones">
    </div>
    <div class="nav-right">
      <button type="button" class="nav-icon" id="btn-theme" title="Modo oscuro" aria-label="Cambiar tema">🌙</button>
      <a href="profile.html" id="nav-avatar-link" class="nav-avatar" aria-label="Mi perfil">
        <img src="assets/default-avatar.svg" id="nav-avatar-img" alt="Mi avatar">
      </a>
    </div>
  </nav>

  <main class="messages-main" id="main-content">
    <div class="conversations-panel">
      <div class="conversations-header">
        <h1>Mensajes</h1>
        <button type="button" class="btn-primary btn-sm" id="btn-new-conv">+ Nuevo</button>
      </div>
      <div id="conversations-list">
        <div class="loading">Cargando...</div>
      </div>
    </div>

    <div class="chat-panel" id="chat-panel">
      <div class="chat-empty">
        <p>Selecciona una conversación</p>
      </div>
    </div>
  </main>

  <!-- Modal nueva conversación -->
  <div class="modal-overlay hidden" id="modal-new-conv" role="dialog" aria-modal="true" aria-labelledby="modal-conv-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-conv-title">Nueva conversación</h3>
        <button type="button" class="modal-close" id="btn-close-conv" aria-label="Cerrar">✕</button>
      </div>
      <div class="form-group">
        <label for="conv-search">Buscar usuario</label>
        <input type="text" id="conv-search" placeholder="Nombre de usuario...">
        <div id="conv-search-results" role="listbox"></div>
      </div>
      <div class="form-group">
        <label class="toggle-label">
          <input type="checkbox" id="conv-is-group" aria-label="Crear grupo">
          Crear grupo
        </label>
      </div>
      <div class="form-group hidden" id="group-name-group">
        <label for="conv-group-name">Nombre del grupo</label>
        <input type="text" id="conv-group-name" placeholder="Nombre del grupo">
      </div>
      <div id="selected-users" class="selected-users" aria-live="polite"></div>
      <button type="button" class="btn-primary" id="btn-create-conv">Crear</button>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Navegación inferior">
    <a href="home.html" class="mobile-nav-item" aria-label="Inicio">🏠</a>
    <a href="search.html" class="mobile-nav-item" aria-label="Buscar">🔍</a>
    <a href="messages.html" class="mobile-nav-item active" aria-label="Mensajes" aria-current="page">✉</a>
    <a href="profile.html" class="mobile-nav-item" aria-label="Perfil">👤</a>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
